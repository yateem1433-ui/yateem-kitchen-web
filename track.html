<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>ติดตามออเดอร์</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body class="bg-gray-100 font-sans p-4">

    <div class="max-w-md mx-auto bg-white rounded-xl shadow-lg overflow-hidden pb-6">
        <div class="bg-blue-600 p-4 text-center">
            <h1 class="text-2xl font-bold text-white">📦 ออเดอร์ของฉัน</h1>
            <p id="last-updated" class="text-xs text-blue-100 mt-1"></p>
        </div>

        <div id="loading" class="text-center p-10">
            <p class="text-gray-500 font-bold animate-pulse">กำลังตรวจสอบสถานะ...</p>
        </div>

        <div id="error-msg" class="hidden text-center p-10 text-red-500 font-bold"></div>

        <div id="not-in-client" class="hidden text-center p-10">
            <p class="text-5xl mb-3">📱</p>
            <p class="text-gray-700 font-bold mb-4">กรุณาเปิดหน้านี้ผ่านแอป LINE เพื่อดูสถานะออเดอร์ค่ะ</p>
            <a id="open-in-line-link" href="#" class="inline-block bg-green-600 text-white font-bold py-2 px-6 rounded-lg">เปิดใน LINE</a>
        </div>

        <div id="no-orders" class="hidden text-center p-10 text-gray-500">
            <p class="text-5xl mb-3">🗒️</p>
            <p>ยังไม่มีประวัติการสั่งซื้อของคุณค่ะ</p>
        </div>

        <div id="status-container" class="hidden p-4">
            <div id="orders-list" class="space-y-4"></div>

            <a href="index.html" class="block w-full text-center bg-gray-100 text-gray-700 font-bold py-3 rounded-lg mt-4 mb-2 border border-gray-300">← กลับหน้าหลัก</a>
            <button onclick="liff.closeWindow()" class="w-full bg-gray-200 text-gray-700 font-bold py-3 rounded-lg">ปิดหน้าต่าง</button>
        </div>
    </div>

    <!-- โมดัลแจ้งปัญหา/เคลมสินค้า -->
    <div id="claim-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-lg shadow-xl max-w-sm w-full p-6">
            <h2 class="text-lg font-bold text-gray-800 mb-1">⚠️ แจ้งปัญหา/เคลมสินค้า</h2>
            <p id="claim-modal-order-id" class="text-xs text-gray-500 mb-4"></p>

            <label class="block text-sm font-medium text-gray-700 mb-1">รายละเอียดปัญหา*</label>
            <textarea id="claim-description" rows="3" class="w-full p-2 border border-gray-300 rounded-md mb-4" placeholder="เช่น สินค้าเสียหาย/ได้ไม่ครบ/ไม่ตรงตามที่สั่ง"></textarea>

            <label class="block text-sm font-medium text-gray-700 mb-1">แนบภาพหลักฐาน (ถ้ามี)</label>
            <input type="file" id="claim-image" accept="image/*" class="w-full text-sm text-gray-500 mb-4 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-red-50 file:text-red-700 hover:file:bg-red-100">

            <div class="flex gap-3">
                <button onclick="closeClaimModal()" class="w-1/3 bg-gray-200 text-gray-700 py-3 rounded-lg font-bold">ยกเลิก</button>
                <button id="btn-submit-claim" onclick="confirmSubmitClaim()" class="w-2/3 bg-red-600 text-white py-3 rounded-lg font-bold hover:bg-red-700">ส่งเรื่องเคลม</button>
            </div>
        </div>
    </div>

    <script>
        // เปลี่ยนเป็น LIFF ID ของคุณ
        const MY_LIFF_ID = '2010829644-9Su4yJnw';
        const EXEC_URL = 'https://script.google.com/macros/s/AKfycbz0Q2AG7WlKzQaWCNii47VS8DU__Tz4eOAAIiCkCn5VL3uBazq9YiGDtf0wYis_A-nlVw/exec';
        const POLL_INTERVAL_MS = 15000;

        async function callApi(action, params) {
            const res = await fetch(EXEC_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ action: action, params: params || {} })
            });
            const data = await res.json();
            if (!data.success) throw new Error(data.error || 'เกิดข้อผิดพลาดไม่ทราบสาเหตุ');
            return data.result;
        }

        function withTimeout(promise, ms, timeoutMessage) {
            return Promise.race([
                promise,
                new Promise((_, reject) => setTimeout(() => reject(new Error(timeoutMessage)), ms))
            ]);
        }

        function showError(message) {
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('error-msg').classList.remove('hidden');
            document.getElementById('error-msg').innerText = message;
        }

        let currentUserId = null;
        let pollTimer = null;
        let pickupAddressCache = null;
        const ordersById = {}; // orderId -> ข้อมูลออเดอร์ล่าสุด (ใช้ตอนเปิดโมดัลเคลม)

        async function main() {
            document.getElementById('open-in-line-link').href = 'https://liff.line.me/' + MY_LIFF_ID;

            try {
                await withTimeout(liff.init({ liffId: MY_LIFF_ID }), 8000, 'เชื่อมต่อ LINE ใช้เวลานานเกินไป');
            } catch (err) {
                showError('เชื่อมต่อ LINE ไม่สำเร็จ: ' + err.message);
                return;
            }

            if (!liff.isLoggedIn()) {
                if (!liff.isInClient()) {
                    // เปิดนอกแอป LINE - หน้าเว็บของ Apps Script ไม่รองรับ login ผ่าน redirect ในเบราว์เซอร์ปกติ
                    document.getElementById('loading').classList.add('hidden');
                    document.getElementById('not-in-client').classList.remove('hidden');
                    return;
                }
                liff.login();
                return;
            }

            let profile;
            try {
                profile = await liff.getProfile();
            } catch (err) {
                showError('ดึงข้อมูลโปรไฟล์ LINE ไม่สำเร็จ: ' + err.message);
                return;
            }

            currentUserId = profile.userId;
            refreshOrders(true);
            pollTimer = setInterval(() => refreshOrders(false), POLL_INTERVAL_MS);
        }

        function refreshOrders(isFirstLoad) {
            callApi('getMyOrders', { userId: currentUserId })
                .then((res) => renderOrders(res, isFirstLoad))
                .catch((err) => {
                    if (isFirstLoad) showError('เกิดข้อผิดพลาดในการตรวจสอบสถานะ: ' + err.message);
                    // โพลรอบถัดไปพลาด ไม่ต้องรบกวนลูกค้าด้วย error เต็มจอ รอรอบถัดไปแทน
                });
        }

        const LIGHT_LABELS = {
            red: 'รับออเดอร์แล้ว กำลังรอครัว/แอดมินยืนยัน',
            yellow: 'กำลังเตรียมอาหาร/สินค้าให้อยู่ค่ะ',
            green: 'พร้อมจัดส่งแล้ว! 🎉'
        };

        const CLAIM_STATUS_LABELS = {
            'รอตรวจสอบ': '🔍 อยู่ระหว่างตรวจสอบ',
        };

        function safeId(orderId) {
            return orderId.replace(/[^a-zA-Z0-9]/g, '_');
        }

        function renderOrders(res, isFirstLoad) {
            document.getElementById('loading').classList.add('hidden');

            if (!res.success) {
                if (isFirstLoad) showError(res.message);
                return;
            }

            document.getElementById('last-updated').innerText = 'อัพเดตล่าสุด ' + new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

            if (res.orders.length === 0) {
                document.getElementById('no-orders').classList.remove('hidden');
                document.getElementById('status-container').classList.add('hidden');
                return;
            }

            document.getElementById('no-orders').classList.add('hidden');
            document.getElementById('status-container').classList.remove('hidden');

            const container = document.getElementById('orders-list');
            container.innerHTML = '';

            res.orders.forEach((order) => {
                ordersById[order.orderId] = order;
                container.insertAdjacentHTML('beforeend', buildOrderCard(order));
                if (order.lightStatus === 'green' && order.type === 'food') {
                    fillRiderAddresses(order);
                }
            });
        }

        function buildOrderCard(order) {
            const sid = safeId(order.orderId);
            const lightStatus = order.lightStatus || 'red';

            const lights = ['red', 'yellow', 'green'].map((color) => {
                const active = color === lightStatus;
                return `<div class="text-center">
                    <div class="w-9 h-9 rounded-full bg-${color === 'yellow' ? 'yellow-400' : color + '-500'} mx-auto mb-1 border-4 ${active ? 'border-gray-800' : 'border-transparent'}"></div>
                </div>`;
            }).join('');

            const trackingBlock = (order.trackingNumber || order.trackingImageUrl)
                ? `<div class="bg-gray-50 rounded-lg p-3 mb-3 text-center">
                    <p class="text-xs text-gray-500">เลขพัสดุ</p>
                    <p class="font-bold text-gray-800 mb-1">${order.trackingNumber || '-'}</p>
                    ${order.trackingImageUrl ? `<a href="${order.trackingImageUrl}" target="_blank" class="text-xs text-blue-600 underline">ดูรูปเลขพัสดุ</a>` : ''}
                   </div>`
                : '';

            const riderBlock = (lightStatus === 'green' && order.type === 'food')
                ? `<div id="rider-call-${sid}" class="mb-3">
                    <div class="text-left bg-gray-50 rounded-lg p-3 mb-2 text-sm">
                        <p class="font-bold text-gray-700">📍 จุดรับอาหาร (ต้นทาง)</p>
                        <p id="rider-pickup-${sid}" class="text-gray-600 mb-2">กำลังโหลด...</p>
                        <p class="font-bold text-gray-700">🏠 จุดส่ง (ที่อยู่ของคุณ)</p>
                        <p class="text-gray-600">${order.address || '-'}</p>
                    </div>
                    <p class="text-xs text-gray-500 mb-2">*กดเปิดแอปแล้วกรอกจุดรับ-ส่งด้านบนเองในแอปได้เลยค่ะ</p>
                    <div class="space-y-2">
                        <a href="grab://open?screen=EXPRESS" target="_blank" class="block w-full text-center bg-green-600 text-white font-bold py-2.5 rounded-lg shadow hover:bg-green-700">เรียก GrabExpress (ส่งพัสดุ)</a>
                        <a href="bolt://" target="_blank" class="block w-full text-center bg-blue-600 text-white font-bold py-2.5 rounded-lg shadow hover:bg-blue-700">เรียก Bolt (เลือกเมนูส่งพัสดุในแอป)</a>
                    </div>
                   </div>`
                : '';

            const receivedBlock = order.receivedStatus
                ? `<div class="flex items-center justify-center gap-2 bg-green-50 border border-green-300 rounded-lg py-3 mb-2">
                    <span class="text-3xl leading-none text-green-600">✅</span>
                    <span class="font-bold text-green-700">ได้รับสินค้าแล้ว</span>
                   </div>`
                : (lightStatus === 'green'
                    ? `<button onclick="confirmReceived('${order.type}', '${order.orderId}')" class="w-full bg-green-600 text-white font-bold py-3 rounded-lg mb-2 hover:bg-green-700">✅ ได้รับสินค้าแล้ว</button>`
                    : '');

            const claimBlock = order.claim
                ? `<div class="bg-red-50 border border-red-200 rounded-lg p-3 text-center">
                    <p class="text-sm font-bold text-red-700">${CLAIM_STATUS_LABELS[order.claim.status] || order.claim.status}</p>
                    <p class="text-xs text-gray-600 mt-1">${order.claim.description || ''}</p>
                   </div>`
                : `<button onclick="openClaimModal('${order.type}', '${order.orderId}')" class="w-full bg-white text-red-600 font-bold py-2.5 rounded-lg border border-red-300 hover:bg-red-50">⚠️ แจ้งปัญหา/เคลมสินค้า</button>`;

            return `
                <div class="border rounded-lg p-4">
                    <div class="flex justify-between items-start mb-2">
                        <div>
                            <p class="text-xs text-gray-500">${order.type === 'food' ? '🍲 อาหาร' : '📦 สินค้าแห้ง'}</p>
                            <h3 class="font-bold text-gray-800">${order.orderId}</h3>
                        </div>
                    </div>
                    <p class="text-sm text-gray-600 mb-3">${order.items}</p>

                    <div class="flex items-center justify-center gap-6 mb-2">${lights}</div>
                    <p class="text-center text-sm font-black text-gray-800 mb-3">${LIGHT_LABELS[lightStatus] || order.status}</p>

                    ${trackingBlock}
                    ${riderBlock}
                    ${receivedBlock}
                    ${claimBlock}
                </div>
            `;
        }

        function fillRiderAddresses(order) {
            const sid = safeId(order.orderId);
            const target = document.getElementById('rider-pickup-' + sid);
            if (!target) return;
            if (pickupAddressCache) {
                target.innerText = pickupAddressCache;
                return;
            }
            callApi('getFoodSettings')
                .then((settings) => {
                    pickupAddressCache = settings.pickupAddress || '-';
                    if (target) target.innerText = pickupAddressCache;
                })
                .catch(() => { /* ถ้าดึงที่อยู่จุดรับไม่สำเร็จ ปล่อยเป็น "กำลังโหลด..." ไว้ ไม่บล็อกการแสดงผล */ });
        }

        function confirmReceived(type, orderId) {
            if (!confirm('ยืนยันว่าคุณได้รับสินค้าเรียบร้อยแล้วใช่ไหมคะ?')) return;
            callApi('markOrderReceived', { orderType: type, orderId: orderId })
                .then((res) => {
                    if (res.success) refreshOrders(false);
                    else alert('เกิดข้อผิดพลาด: ' + res.error);
                })
                .catch((err) => alert('เกิดข้อผิดพลาด: ' + err.message));
        }

        // ---------------- แจ้งปัญหา/เคลมสินค้า ----------------

        let pendingClaimOrder = null;

        function openClaimModal(type, orderId) {
            pendingClaimOrder = { type, orderId };
            document.getElementById('claim-modal-order-id').innerText = 'ออเดอร์: ' + orderId;
            document.getElementById('claim-description').value = '';
            document.getElementById('claim-image').value = '';
            document.getElementById('claim-modal').classList.remove('hidden');
        }

        function closeClaimModal() {
            document.getElementById('claim-modal').classList.add('hidden');
            pendingClaimOrder = null;
        }

        const getBase64 = (file) => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result);
            reader.onerror = (error) => reject(error);
        });

        async function confirmSubmitClaim() {
            if (!pendingClaimOrder) return;
            const description = document.getElementById('claim-description').value.trim();
            if (!description) {
                alert('กรุณากรอกรายละเอียดปัญหาก่อนส่งเรื่องเคลมค่ะ');
                return;
            }

            const btn = document.getElementById('btn-submit-claim');
            btn.disabled = true;
            btn.innerText = 'กำลังส่ง...';

            const imageFile = document.getElementById('claim-image').files[0];
            const order = pendingClaimOrder;

            try {
                const imageBase64 = imageFile ? await getBase64(imageFile) : null;
                const imageName = imageFile ? `claim_${order.orderId}_${new Date().getTime()}.png` : null;

                const res = await callApi('submitClaim', {
                    orderType: order.type,
                    orderId: order.orderId,
                    userId: currentUserId,
                    description: description,
                    imageBase64: imageBase64,
                    imageName: imageName
                });

                btn.disabled = false;
                btn.innerText = 'ส่งเรื่องเคลม';

                if (res.success) {
                    closeClaimModal();
                    alert('ส่งเรื่องเคลมเรียบร้อยแล้วค่ะ 🙏 แอดมินจะรีบตรวจสอบให้นะคะ');
                    refreshOrders(false);
                } else {
                    alert('เกิดข้อผิดพลาด: ' + res.error);
                }
            } catch (err) {
                btn.disabled = false;
                btn.innerText = 'ส่งเรื่องเคลม';
                alert('เกิดข้อผิดพลาดในการส่งเรื่องเคลม: ' + err.message);
            }
        }

        main();
    </script>
</body>
</html>
