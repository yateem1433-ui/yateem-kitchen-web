<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>บอทครัว Yateem - ย้ายที่อยู่แล้ว</title>
    <!-- บอทครัวย้ายไป repo ของตัวเอง (yateem-kitchen-voice) เพราะหน้านี้อยู่ใต้ scope ของแอป Yateem Market
         ทำให้ Android ติดตั้ง/เปิดเป็นแอป Market แทน - หน้านี้เหลือไว้ให้ลิงก์เก่าที่ส่งไปแล้วยังใช้ได้ -->
    <meta http-equiv="refresh" content="0; url=https://yateem1433-ui.github.io/yateem-kitchen-voice/">
</head>
<body style="background:#0E2036;color:#fff;font-family:system-ui,sans-serif;text-align:center;padding:40px 16px">
    <p>บอทครัวย้ายไปที่อยู่ใหม่แล้วค่ะ กำลังพาไป…</p>
    <p><a style="color:#f59e0b" href="https://yateem1433-ui.github.io/yateem-kitchen-voice/">แตะที่นี่ถ้าไม่ไปเอง</a></p>
    <script>
        // ยกเลิก service worker เก่าที่เคยผูกกับ voice.html (ไฟล์ sw-voice.js ถูกลบแล้ว)
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(regs => regs.forEach(r => {
                if (/\/voice\.html$/.test(r.scope)) r.unregister();
            })).catch(() => {});
        }
        location.replace('https://yateem1433-ui.github.io/yateem-kitchen-voice/');
    </script>
</body>
</html>
