<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <meta name="robots" content="noindex">
    <title>ทดสอบลิงก์ Grab/Bolt</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
</head>
<!-- หน้าทดสอบชั่วคราว (ไม่มีลิงก์จากหน้าไหน): หาว่าลิงก์แบบไหนพาเข้าหน้า GrabExpress / Bolt ส่งพัสดุได้ตรงๆ
     Grab/Bolt ไม่มีเอกสารสาธารณะเรื่องนี้ ต้องลองบนมือถือจริงใน LINE - ได้ผลแล้วเอาไปใส่ใน track.html แล้วลบไฟล์นี้ -->
<body class="bg-gray-100 p-4" style="font-family:sans-serif;">
    <div class="max-w-md mx-auto">
        <h1 class="text-lg font-bold mb-1">ทดสอบปุ่มเรียกไรเดอร์</h1>
        <p class="text-sm text-gray-600 mb-4">กดทีละปุ่ม ดูว่าแอปเปิดไปที่หน้าไหน แล้วกลับมาที่ LINE กดปุ่มถัดไป<br>
            จดเลขที่เข้าหน้า <b>GrabExpress</b> หรือหน้า <b>ส่งพัสดุของ Bolt</b> ได้ตรงๆ แล้วบอกว่ามือถือเป็น Android หรือ iPhone ค่ะ</p>

        <h2 class="font-bold text-green-700 mb-2">🟢 Grab</h2>
        <div id="grab" class="space-y-2 mb-6"></div>

        <h2 class="font-bold text-blue-700 mb-2">🔵 Bolt</h2>
        <div id="bolt" class="space-y-2 mb-6"></div>
    </div>

    <script>
        const GRAB_PKG = 'com.grabtaxi.passenger';
        const BOLT_PKG = 'ee.mtakso.client';
        // intent:// = วิธีเปิดแอปของ Android โดยระบุแพ็กเกจตรงๆ (iPhone กดแล้วจะไม่เกิดอะไร เป็นเรื่องปกติ)
        const androidIntent = (scheme, pkg, rest) => `intent://${rest}#Intent;scheme=${scheme};package=${pkg};end`;

        const LINKS = {
            grab: [
                'grab://open?screen=EXPRESS',
                'grab://open?screenType=EXPRESS',
                'grab://open?screenType=GRABEXPRESS',
                'grab://open?screenType=DELIVERY',
                'grab://open?screenType=SEND',
                'grab://open?screen=GRABEXPRESS',
                'grab://express',
                androidIntent('grab', GRAB_PKG, 'open?screenType=EXPRESS'),
            ],
            bolt: [
                'bolt://',
                'bolt://delivery',
                'bolt://send',
                'bolt://action/delivery',
                'bolt://open?screen=delivery',
                'taxify://delivery',
                androidIntent('bolt', BOLT_PKG, 'delivery'),
            ]
        };

        let n = 0;
        ['grab', 'bolt'].forEach((key) => {
            const box = document.getElementById(key);
            LINKS[key].forEach((url) => {
                n++;
                const a = document.createElement('a');
                a.href = url;
                a.className = 'block bg-white rounded-lg shadow p-3 text-sm';
                a.innerHTML = `<span class="font-bold text-lg mr-2">${n}.</span><span class="text-gray-500 break-all">${url.replace(/</g, '&lt;')}</span>`;
                box.appendChild(a);
            });
        });
    </script>
</body>
</html>
